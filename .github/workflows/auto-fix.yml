name: Claude Auto Fix

on:
  issues:
    # opened と labeled の両方にすると、作成時に bug を付けると2回走る（opened + labeled）
    types: [labeled]

permissions:
  contents: write        # コードを書き換える権限
  pull-requests: write   # PRを作成する権限
  issues: write          # Issueにコメントする権限
  id-token: write

jobs:
  fix:
    runs-on: ubuntu-latest
    # 今回付与されたラベルが bug のときだけ実行（他ラベル付与では起動しない）
    if: github.event.label.name == 'bug'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: anthropics/claude-code-action@v1
        with:
          base_branch: main
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            以下のGitHub Issueに記載された不具合を修正してください。

            ## Issue タイトル
            ${{ github.event.issue.title }}

            ## Issue 内容
            ${{ github.event.issue.body }}

            修正の手順：
            1. Issueの内容を読んで、どのファイルのどの処理が原因か特定してください
            2. 該当箇所のコードを修正してください
            3. 修正内容を説明するPRを作成してください

            注意事項：
            - 修正はできるだけ最小限にとどめてください
            - 既存のコードスタイルに合わせてください
            - テストファイルがある場合は、テストも更新してください
          claude_args: --allowedTools Edit,Write,Bash,Read,Glob,Grep
          show_full_output: true
