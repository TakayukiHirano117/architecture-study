name: Claude Auto Fix

on:
  issues:
    types: [opened, labeled]  # Issue作成時 or ラベル付与時に起動

permissions:
  contents: write        # コードを書き換える権限
  pull-requests: write   # PRを作成する権限
  issues: write          # Issueにコメントする権限
  id-token: write

jobs:
  fix:
    runs-on: ubuntu-latest
    # bugラベルが付いたIssueのみ実行する
    if: contains(github.event.issue.labels.*.name, 'bug')
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            以下のGitHub Issueに記載された不具合を修正してください。

            ## Issue タイトル
            ${{ github.event.issue.title }}

            ## Issue 内容
            ${{ github.event.issue.body }}

            修正の手順：
            1. Issueの内容を読んで、どのファイルのどの処理が原因か特定してください
            2. 該当箇所のコードを修正してください
            3. 修正内容を説明するPRを作成してください

            注意事項：
            - 修正はできるだけ最小限にとどめてください
            - 既存のコードスタイルに合わせてください
            - テストファイルがある場合は、テストも更新してください
          claude_args: |
            --max-turns 10
          show_full_output: true
